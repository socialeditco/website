<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Social Edit Co. | Consistency as a Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <style>
        /* --- GLOBAL RESET & EXTRA CRISPY FOUNDATION --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; 
            overflow-x: hidden; 
            background: #FCFCF9; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }
        body {
            font-family: 'Inter', sans-serif;
            color: #1A2F2A;
        }
        :root {
            --green: #65C466;
            --blue: #00ACD2;
            --dark: #1E2E2A;
            --radius-xl: 32px;
            --radius-lg: 24px;
            --shadow-sm: 0 10px 25px -8px rgba(0,0,0,0.05);
            --shadow-md: 0 20px 35px -12px rgba(0,0,0,0.12);
        }
        #three-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.35;
        }

        /* =========================
           GLOBAL DEPTH SYSTEM 
           ========================= */
        .site-content {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            transition: transform 0.5s ease, filter 0.5s ease;
        }
        .site-content.focus-mode {
            transform: scale(0.96);
            filter: blur(8px) brightness(0.85);
        }

        .container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 32px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            cursor: pointer;
            border: none;
            text-decoration: none;
        }
        .btn-primary {
            background: var(--blue);
            color: white;
            box-shadow: 0 8px 18px rgba(0,172,210,0.25);
        }
        .btn-primary:hover {
            background: #0090b0;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: transparent;
            border: 1.5px solid #C9D2CB;
            color: #1E3A34;
        }
        .btn-secondary:hover {
            border-color: var(--green);
            background: rgba(101,196,102,0.06);
            transform: translateY(-2px);
        }

        /* --- TOP RIGHT HAMBURGER MENU --- */
        .nav-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10001;
            background: var(--blue);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .nav-toggle:hover { background: #0090b0; }
        .nav-toggle span {
            width: 26px;
            height: 3px;
            background: white;
            border-radius: 3px;
            transition: 0.3s;
        }
        .mobile-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 280px;
            height: 100vh;
            background: rgba(30,46,42,0.98);
            backdrop-filter: blur(12px);
            z-index: 10000;
            padding: 80px 24px 40px;
            transition: right 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-shadow: -5px 0 30px rgba(0,0,0,0.2);
        }
        .mobile-menu.open { right: 0; }
        .mobile-menu a, .mobile-menu .menu-item {
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 500;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
            cursor: pointer;
        }
        .mobile-menu a:hover, .mobile-menu .menu-item:hover {
            color: var(--green);
            padding-left: 8px;
        }
        .mobile-menu i {
            width: 24px;
            color: var(--green);
        }

        /* Hero & Video */
        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
            align-items: center;
            padding: 60px 0;
        }
        .lvl-video-frame {
            width: 100%;
            max-width: 800px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--blue);
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            position: relative;
            z-index: 1;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .lvl-video-frame:hover { transform: scale(1.01); }
        .lvl-video-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            pointer-events: none;
            z-index: 2;
            animation: lvlBorderPulse 3s infinite alternate;
        }
        @keyframes lvlBorderPulse {
            0% { box-shadow: 0 0 0 0 rgba(101,196,102,0.2), inset 0 0 0 0 rgba(101,196,102,0.2); }
            100% { box-shadow: 0 0 0 4px rgba(0,172,210,0.4), inset 0 0 0 1px rgba(0,172,210,0.3); }
        }
        .lvl-video-frame video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .hero-badge {
            background: rgba(101,196,102,0.15);
            color: var(--green);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }
        .hero-headline {
            font-size: 3.2rem;
            font-weight: 800;
            font-family: 'Syne', sans-serif;
            line-height: 1.2;
            margin-bottom: 20px;
        }
        .hero-headline span { display: inline; }
        .hero-desc {
            font-size: 1.05rem;
            color: #40655A;
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .btn-group { display: flex; gap: 16px; flex-wrap: wrap; }

        /* =========================
           LIGHTBOX (GLASS STYLE)
           ========================= */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(20, 30, 28, 0.35);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            animation: fadeGlass 0.4s ease forwards;
            animation-delay: 0.3s;
        }
        @keyframes fadeGlass {
            to { opacity: 1; }
        }
        .lightbox-content {
            width: 100%;
            max-width: min(1100px, 95vw);
            border-radius: 24px;
            overflow: hidden;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(30px);
            box-shadow: 0 40px 100px rgba(0,0,0,0.35);
            transform: scale(0.92);
            animation: zoomIn 0.35s cubic-bezier(0.2, 1.2, 0.3, 1) forwards;
            aspect-ratio: 16 / 9; /* Maintains shape for both video and images */
        }
        .lightbox-content video, .lightbox-content img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }
        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 2;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 10px 14px;
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            font-weight: 600;
        }
        @keyframes zoomIn {
            to { transform: scale(1); }
        }

        /* Global Sections */
        section {
            padding: 80px 0;
            border-bottom: 1px solid #E4EAE2;
        }
        .section-title {
            font-size: 2.8rem;
            font-weight: 800;
            font-family: 'Syne', sans-serif;
            letter-spacing: -0.02em;
            color: #1A2F2A;
            margin-bottom: 16px;
        }
        .section-sub {
            font-size: 1.2rem;
            color: #4A6B5E;
            max-width: 700px;
            margin-bottom: 40px;
        }

        /* Statement & Pain Points */
        .statement-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; margin-bottom: 32px; }
        .statement-big { font-size: 2rem; font-weight: 700; line-height: 1.3; }
        .quote-block { background: #EDF3EA; padding: 28px; border-radius: var(--radius-lg); font-size: 1.25rem; font-weight: 500; border-left: 5px solid var(--green); }
        .support-text { margin-top: 24px; font-size: 1rem; color: #557268; max-width: 85%; text-align: left; }
        .marquee-wrapper { background: #1A2F2A; color: white; padding: 22px 0; overflow: hidden; white-space: nowrap; }
        .marquee-track { display: inline-block; animation: scrollMarquee 20s linear infinite; font-weight: 700; font-size: 1.4rem; letter-spacing: 1px; }
        .marquee-track span { margin: 0 28px; }
        @keyframes scrollMarquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .pain-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; margin: 48px 0 32px; }
        .pain-card { background: white; padding: 28px 20px; border-radius: 24px; box-shadow: var(--shadow-sm); border: 1px solid #E2E8E0; text-align: center; }
        .pain-icon { font-size: 2.2rem; margin-bottom: 16px; color: var(--blue); }
        .close-bold { font-size: 1.3rem; font-weight: 700; margin-top: 16px; padding-top: 20px; border-top: 2px solid #DDE5DC; }

        /* =========================
           CARD SYSTEM (PRICING)
           ========================= */
        .pricing-grid { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; margin: 48px 0 24px; }
        .pricing-card {
            background: white;
            border-radius: 32px;
            padding: 32px 28px;
            flex: 1;
            min-width: 260px;
            box-shadow: var(--shadow-sm);
            border: 1px solid #E2E9E2;
            transition: transform 0.3s ease, opacity 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .pricing-card.popular {
            border-top: 4px solid var(--blue);
            box-shadow: var(--shadow-md);
        }
        .pricing-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        /* When one is active */
        .pricing-card.active {
            transform: scale(1.05);
            z-index: 2;
            border-color: var(--blue);
        }
        /* Fade others */
        .pricing-grid:has(.pricing-card.active) .pricing-card:not(.active) {
            opacity: 0.5;
            transform: scale(0.98);
        }
        .price { font-size: 2.6rem; font-weight: 800; margin: 16px 0 8px; }
        .pricing-features { list-style: none; margin: 24px 0; }
        .pricing-features li { margin: 12px 0; display: flex; gap: 10px; align-items: center; }
        .callout { background: #F3F8F1; padding: 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; }

        /* =========================
           EPIC GALLERY SYSTEM
           ========================= */
        .gallery {
            --size: clamp(110px, 18vw, 160px);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(var(--size), 1fr));
            gap: clamp(12px, 2vw, 22px);
            margin-top: 32px;
        }
        .gallery-item {
            position: relative;
            border-radius: 28px;
            overflow: visible;
            cursor: pointer;
            perspective: 1000px;
        }
        .gallery-inner {
            border-radius: 28px;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .gallery-item img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            /* Morphing organic shape */
            clip-path: polygon(12% 8%, 88% 6%, 96% 28%, 92% 78%, 80% 94%, 20% 96%, 6% 70%, 4% 22%);
            transition: clip-path 0.5s cubic-bezier(0.4, 1.4, 0.4, 1), transform 0.5s ease;
        }
        /* Hover / Tap Morph */
        .gallery-item:hover img, .gallery-item.active img {
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
            transform: scale(1.08);
        }
        /* Lift + Tilt (desktop only) */
        @media (hover: hover) {
            .gallery-item:hover .gallery-inner {
                transform: rotateX(6deg) rotateY(-6deg) scale(1.04);
            }
        }

        /* About & Contact */
        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
        .about-img { text-align: center; }
        .about-img img { width: 280px; border-radius: 50%; border: 4px solid var(--blue); object-fit: cover; aspect-ratio: 1/1; }
        .founded-text { margin-top: 16px; font-size: 0.9rem; color: var(--blue); font-weight: 600; text-align: center; }
        .checklist { list-style: none; margin: 24px 0; }
        .checklist li { margin: 14px 0; display: flex; gap: 12px; align-items: flex-start; }
        .checklist i { color: var(--green); width: 22px; margin-top: 2px; }

        .contact-form-section { background: #FFFFFF; border-radius: 48px; padding: 48px 40px; margin: 0 0 48px 0; box-shadow: var(--shadow-md); border: 1px solid #E4EAE2; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #2F4D45; }
        .input-group input { width: 100%; padding: 14px 18px; border-radius: 16px; border: 1px solid #D4DDD4; background: #FEFEF9; font-family: 'Inter', sans-serif; }
        .input-group input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px rgba(0,172,210,0.2); }
        .optional { font-size: 0.75rem; color: #7A9A8C; margin-left: 6px; }

        /* Footer Alignment */
        .contact-card { background: #1E2E2A; border-radius: 48px; padding: 48px 40px; color: white; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px; margin-top: 24px; }
        .contact-info p { margin: 16px 0; display: flex; align-items: center; gap: 14px; text-align: left; }
        .footer-bottom { text-align: center; margin-top: 48px; padding: 24px 0 40px; font-size: 0.85rem; color: #7A9A8C; }

        /* Mobile overrides */
        @media (max-width: 900px) {
            .container { padding: 0 24px; }
            .hero-grid { grid-template-columns: 1fr; text-align: left; padding: 40px 0; }
            .hero-headline { font-size: 2.4rem; }
            .section-title { font-size: 2rem; }
            .support-text { max-width: 100%; text-align: left; }
            .statement-grid { grid-template-columns: 1fr; gap: 28px; }
            .about-grid { display: flex; flex-direction: column; align-items: center; text-align: center; }
            .about-img { order: 1; margin-bottom: 20px; }
            .about-content { order: 2; }
            .contact-card { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 40px 20px; }
            .contact-card .logo-horizontal { margin: 0 auto 20px; display: block; }
            .contact-info { align-items: flex-start; display: inline-flex; width: auto; flex-direction: column; gap: 0;}
            .contact-info p { justify-content: flex-start; }
            .form-grid { grid-template-columns: 1fr; }
            .checklist li { font-size: 0.9rem; line-height: 1.3; align-items: flex-start; text-align: left; }
        }
        @media (min-width: 901px) {
            .contact-card div:last-child { border-left: 1px solid rgba(255,255,255,0.1); padding-left: 40px; text-align: left; }
            .contact-card .logo-horizontal { margin: 0 0 15px 0 !important; }
        }
        @media (max-width: 600px) {
            .contact-form-section, .contact-card { padding: 32px 24px; }
        }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

// Get Framer Motion
const MotionLib = window.Motion || {};
const motion = MotionLib.motion || window.motion;
const MotionComponent = motion || { div: (props) => React.createElement('div', props) };

// Three.js background
function initThreeBackground() {
    const canvas = document.getElementById('three-canvas');
    if (!canvas) return;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 28;
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    
    const particlesGeo = new THREE.BufferGeometry();
    const count = 800;
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
        positions[i*3] = (Math.random() - 0.5) * 90;
        positions[i*3+1] = (Math.random() - 0.5) * 60;
        positions[i*3+2] = (Math.random() - 0.5) * 50 - 20;
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({ color: 0x65C466, size: 0.16, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
    const particles = new THREE.Points(particlesGeo, particleMat);
    scene.add(particles);
    
    const ringGeo = new THREE.TorusGeometry(5.5, 0.1, 64, 300);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0x00ACD2, emissive: 0x0077A0, transparent: true, opacity: 0.35 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    scene.add(ring);
    const ring2Geo = new THREE.TorusGeometry(8, 0.08, 64, 300);
    const ring2Mat = new THREE.MeshStandardMaterial({ color: 0x65C466, emissive: 0x338833, transparent: true, opacity: 0.3 });
    const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
    scene.add(ring2);
    
    const ambient = new THREE.AmbientLight(0x404060);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(1, 2, 1);
    scene.add(dirLight);
    
    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.006;
        particles.rotation.y = time * 0.1;
        particles.rotation.x = Math.sin(time * 0.2) * 0.1;
        ring.rotation.x = time * 0.3;
        ring.rotation.z = time * 0.2;
        ring2.rotation.y = time * 0.25;
        ring2.rotation.x = time * 0.15;
        camera.position.x = Math.sin(time * 0.08) * 1.2;
        camera.position.y = Math.cos(time * 0.1) * 0.7;
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}

function scrollToSection(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

const SocialEditLanding = () => {
    const [menuOpen, setMenuOpen] = React.useState(false);
    const [lightboxOpen, setLightboxOpen] = React.useState(false);
    const [lightboxMedia, setLightboxMedia] = React.useState(null); 
    const [focusMode, setFocusMode] = React.useState(false);
    const [animating, setAnimating] = React.useState(false);
    const [activeCard, setActiveCard] = React.useState(null);

    const videoUrl = "https://assets.cdn.filesafe.space/E2BEbKIK8SvsJICq4vXY/media/69d3341284c045c274814fd2.mp4";
    const emailLink = "mailto:info@socialeditco.com?subject=Contact%20me%20to%20go%20over%20the%20best%20options%20for%20my%20business";
    
    // Magnetic Cursor Effect
    React.useEffect(() => {
        const items = document.querySelectorAll('.gallery-item');
        items.forEach(item => {
            item.addEventListener('mousemove', (e) => {
                const rect = item.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width - 0.5;
                const y = (e.clientY - rect.top) / rect.height - 0.5;
                item.querySelector('.gallery-inner').style.transform = `rotateX(${y * -10}deg) rotateY(${x * 10}deg) scale(1.05)`;
            });
            item.addEventListener('mouseleave', () => {
                item.querySelector('.gallery-inner').style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
            });
        });
    }, []);

    React.useEffect(() => {
        initThreeBackground();
        if (menuOpen || lightboxOpen) {
            document.body.style.overflow = 'hidden';
        } else {
            document.body.style.overflow = '';
        }
    }, [menuOpen, lightboxOpen]);

    // =========================
    // SHARED TRANSITION ENGINE (FLIP)
    // =========================
    const openLightboxFLIP = (el, src) => {
        if (animating) return;
        setAnimating(true);
        setFocusMode(true); 

        const rect = el.getBoundingClientRect();
        const clone = el.cloneNode(true);

        clone.style.position = 'fixed';
        clone.style.top = rect.top + 'px';
        clone.style.left = rect.left + 'px';
        clone.style.width = rect.width + 'px';
        clone.style.height = rect.height + 'px';
        clone.style.margin = 0;
        clone.style.zIndex = 999999;
        clone.style.borderRadius = '24px';
        clone.style.transition = 'all 0.5s cubic-bezier(0.2, 1, 0.3, 1)';
        clone.style.objectFit = 'cover';

        document.body.appendChild(clone);
        clone.getBoundingClientRect(); // Force repaint

        const targetWidth = Math.min(window.innerWidth * 0.9, 1100);
        const targetHeight = targetWidth * 0.5625; // Aspect Ratio 16:9

        clone.style.top = (window.innerHeight / 2 - targetHeight / 2) + 'px';
        clone.style.left = (window.innerWidth / 2 - targetWidth / 2) + 'px';
        clone.style.width = targetWidth + 'px';
        clone.style.height = targetHeight + 'px';
        clone.style.borderRadius = '20px';

        setTimeout(() => {
            setLightboxMedia(src);
            setLightboxOpen(true);
            document.body.removeChild(clone);
            setAnimating(false);
