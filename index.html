    const particlesGeo = new THREE.BufferGeometry();
    const count = 900;
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
        positions[i*3] = (Math.random() - 0.5) * 90;
        positions[i*3+1] = (Math.random() - 0.5) * 60;
        positions[i*3+2] = (Math.random() - 0.5) * 50 - 20;
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({ color: 0x65C466, size: 0.18, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending });

    scene.add(particles);
    
    // accent rings

    scene.add(ring);

    const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
    scene.add(ring2);
    
    const ambient = new THREE.AmbientLight(0x404060);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(1, 2, 1);
    scene.add(dirLight);
    
    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.006;
        particles.rotation.y = time * 0.1;
        particles.rotation.x = Math.sin(time * 0.2) * 0.1;
        ring.rotation.x = time * 0.3;
        ring.rotation.z = time * 0.2;
        ring2.rotation.y = time * 0.25;
        ring2.rotation.x = time * 0.15;

        camera.position.y = Math.cos(time * 0.1) * 0.7;
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}
