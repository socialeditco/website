<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Social Edit Co. | Consistency as a Service</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- React + ReactDOM UMD -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <!-- Babel Standalone -->
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <!-- Three.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Framer Motion UMD -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #FCFCF9;
            color: #1A2F2A;
            overflow-x: hidden;
        }
        :root {
            --green: #65C466;
            --blue: #00ACD2;
            --dark: #1E2E2A;
            --radius-xl: 32px;
            --radius-lg: 24px;
            --shadow-sm: 0 10px 25px -8px rgba(0,0,0,0.05);
            --shadow-md: 0 20px 35px -12px rgba(0,0,0,0.12);
        }
        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.35;
        }
        .site-content {
            position: relative;
            z-index: 2;
            background: rgba(252,252,249,0.94);
            backdrop-filter: blur(1px);
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 32px;
        }
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            cursor: pointer;
            border: none;
            text-decoration: none;
        }
        .btn-primary {
            background: var(--blue);
            color: white;
            box-shadow: 0 8px 18px rgba(0,172,210,0.25);
        }
        .btn-primary:hover {
            background: #0090b0;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: transparent;
            border: 1.5px solid #C9D2CB;
            color: #1E3A34;
        }
        .btn-secondary:hover {
            border-color: var(--green);
            background: rgba(101,196,102,0.06);
            transform: translateY(-2px);
        }
        /* Navbar - hidden on mobile */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0 16px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .logo-horizontal {
            height: 52px;
            width: auto;
        }
        .nav-links {
            display: flex;
            gap: 32px;
            align-items: center;
        }
        .nav-links a {
            text-decoration: none;
            font-weight: 500;
            color: #2F4D45;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: var(--blue); }
        /* Sections */
        section {
            padding: 80px 0;
            border-bottom: 1px solid #E4EAE2;
        }
        .section-title {
            font-size: 2.8rem;
            font-weight: 800;
            font-family: 'Syne', sans-serif;
            letter-spacing: -0.02em;
            color: #1A2F2A;
            margin-bottom: 16px;
        }
        .section-sub {
            font-size: 1.2rem;
            color: #4A6B5E;
            max-width: 700px;
            margin-bottom: 40px;
        }
        /* Hero grid - video with clickable lightbox */
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: center;
        }
        .hero-video-wrapper {
            border-radius: 28px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            background: #E2E8E2;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .hero-video-wrapper:hover {
            transform: scale(1.01);
        }
        .hero-video-wrapper video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            aspect-ratio: 16 / 9;
            pointer-events: none; /* click goes to wrapper for lightbox */
        }
        .hero-badge {
            background: rgba(101,196,102,0.15);
            color: var(--green);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }
        .hero-headline {
            font-size: 3.2rem;
            font-weight: 800;
            font-family: 'Syne', sans-serif;
            line-height: 1.2;
            margin-bottom: 20px;
        }
        .hero-headline span {
            display: inline;
        }
        .hero-desc {
            font-size: 1.05rem;
            color: #40655A;
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .btn-group { display: flex; gap: 16px; flex-wrap: wrap; }
        /* Statement */
        .statement-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            margin-bottom: 32px;
        }
        .statement-big {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.3;
        }
        .quote-block {
            background: #EDF3EA;
            padding: 28px;
            border-radius: var(--radius-lg);
            font-size: 1.25rem;
            font-weight: 500;
            border-left: 5px solid var(--green);
        }
        .support-text {
            margin-top: 24px;
            font-size: 1rem;
            color: #557268;
            max-width: 85%;
            text-align: left;
            margin-left: 0;
            margin-right: auto;
        }
        /* Marquee */
        .marquee-wrapper {
            background: #1A2F2A;
            color: white;
            padding: 22px 0;
            overflow: hidden;
            white-space: nowrap;
        }
        .marquee-track {
            display: inline-block;
            animation: scrollMarquee 20s linear infinite;
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: 1px;
        }
        .marquee-track span { margin: 0 28px; }
        @keyframes scrollMarquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        /* Pain Points */
        .pain-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
            margin: 48px 0 32px;
        }
        .pain-card {
            background: white;
            padding: 28px 20px;
            border-radius: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid #E2E8E0;
            text-align: center;
        }
        .pain-icon {
            font-size: 2.2rem;
            margin-bottom: 16px;
            color: var(--blue);
        }
        .close-bold {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 16px;
            padding-top: 20px;
            border-top: 2px solid #DDE5DC;
        }
        /* Pricing Cards */
        .pricing-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            justify-content: center;
            margin: 48px 0 24px;
        }
        .pricing-card {
            background: white;
            border-radius: 32px;
            padding: 32px 28px;
            flex: 1;
            min-width: 260px;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
            border: 1px solid #E2E9E2;

        .pricing-card.popular {

        }
        .price {
            font-size: 2.6rem;
            font-weight: 800;

        .pricing-features {

            margin: 24px 0;

        .pricing-features li {

            display: flex;
            gap: 10px;
            align-items: center;
        }
        .callout {

            padding: 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;

        .gallery-item {

            box-shadow: var(--shadow-sm);
            background: #F3F5F0;
            transition: all 0.3s;

            height: 260px;
            object-fit: contain;
            background: #FFFFFF;
            transition: transform 0.4s;
            padding: 8px;

        /* About */

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: start;
        }

            color: var(--blue);

            text-align: center;
            letter-spacing: 0.5px;

            margin: 24px 0;

            display: flex;
            gap: 12px;
            align-items: center;

        .input-group {

        }

            margin-bottom: 8px;
            font-weight: 500;
            color: #2F4D45;
        }
        .input-group input {

            padding: 14px 18px;
            border-radius: 16px;

            background: #FEFEF9;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;

        .input-group input:focus {

            border-color: var(--blue);

        }
        .optional {

            color: #7A9A8C;
            margin-left: 6px;
        }
        .contact-card {
            background: #1E2E2A;
            border-radius: 48px;
            padding: 48px 40px;
            color: white;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 24px;
        }
        .contact-info p {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .footer-bottom {
            text-align: center;
            margin-top: 48px;
            padding: 24px 0 40px;
            font-size: 0.85rem;
            color: #7A9A8C;
        }
        /* ========== FLOATING MENU (FAB) ========== */
        .fab {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 9999;
            display: block;
        }
        .fab-main {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: var(--blue);
            color: white;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,172,210,0.4);
            transition: transform 0.2s, background 0.2s;
        }
        .fab-main:hover {
            background: #0090b0;
            transform: scale(1.02);
        }
        .fab-actions {
            position: absolute;
            bottom: 70px;
            right: 0;
            display: none;
            flex-direction: column;
            gap: 12px;
            background: transparent;
            max-height: 70vh;
            overflow-y: auto;
            padding-bottom: 8px;
        }
        .fab.open .fab-actions {
            display: flex;
        }
        .fab-action-item, .fab-phrase {
            background: rgba(30,46,42,0.95);
            backdrop-filter: blur(8px);
            padding: 10px 20px;
            border-radius: 60px;
            text-decoration: none;
            color: white;
            font-weight: 500;
            border: 1px solid rgba(101,196,102,0.5);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
        }
        .fab-action-item i {
            font-size: 1.1rem;
            color: var(--green);
        }
        .fab-action-item:hover {
            background: var(--blue);
            border-color: white;
            transform: translateX(-4px);
        }
        .fab-phrase {
            background: rgba(0,0,0,0.8);
            border-color: var(--green);
            color: var(--green);
            font-weight: 600;
            white-space: nowrap;
            pointer-events: none;
        }
        /* Lightbox Modal */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .lightbox-content {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0,0,0,0.5);
        }
        .lightbox-content video {
            width: 100%;
            height: auto;
            max-height: 90vh;
            display: block;
        }
        /* Mobile specific: hide navbar, adjust text, menu overflow */
        @media (max-width: 900px) {
            .navbar {
                display: none;
            }
            .hero-grid {
                grid-template-columns: 1fr;
                gap: 32px;
            }
            .hero-headline {
                font-size: 2.4rem;
            }
            .hero-headline span {
                display: block;
            }
            .container {
                padding: 0 24px;
            }
            .section-title {
                font-size: 2rem;
            }
            .support-text {
                max-width: 100%;
                text-align: left;
            }
            .fab-actions {
                max-height: 65vh;
                overflow-y: auto;
                scrollbar-width: thin;
            }
            .fab-action-item, .fab-phrase {
                white-space: nowrap;
                font-size: 0.85rem;
                padding: 8px 18px;
            }
        }
        @media (max-width: 640px) {
            .pricing-card {
                min-width: 100%;
            }
            .fab-action-item {
                font-size: 0.8rem;
            }
            .fab-phrase {
                font-size: 0.75rem;
                white-space: nowrap;
            }
        }
        .support-text {
            text-align: left;
        }
    </style>
</head>

<script type="text/babel" data-presets="react">

// Get Framer Motion from UMD
const MotionLib = window.Motion || {};
const motion = MotionLib.motion || window.motion;
const MotionComponent = motion || { div: (props) => React.createElement('div', props) };

// Three.js background
function initThreeBackground() {
    const canvas = document.getElementById('three-canvas');
    if (!canvas) return;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 28;
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    
    const particlesGeo = new THREE.BufferGeometry();
    const count = 800;
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
        positions[i*3] = (Math.random() - 0.5) * 90;
        positions[i*3+1] = (Math.random() - 0.5) * 60;
        positions[i*3+2] = (Math.random() - 0.5) * 50 - 20;
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({ color: 0x65C466, size: 0.16, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
    const particles = new THREE.Points(particlesGeo, particleMat);
    scene.add(particles);
    
    const ringGeo = new THREE.TorusGeometry(5.5, 0.1, 64, 300);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0x00ACD2, emissive: 0x0077A0, transparent: true, opacity: 0.35 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    scene.add(ring);
    const ring2Geo = new THREE.TorusGeometry(8, 0.08, 64, 300);
    const ring2Mat = new THREE.MeshStandardMaterial({ color: 0x65C466, emissive: 0x338833, transparent: true, opacity: 0.3 });
    const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
    scene.add(ring2);
    
    const ambient = new THREE.AmbientLight(0x404060);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(1, 2, 1);
    scene.add(dirLight);
    
    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.006;
        particles.rotation.y = time * 0.1;
        particles.rotation.x = Math.sin(time * 0.2) * 0.1;
        ring.rotation.x = time * 0.3;
        ring.rotation.z = time * 0.2;
        ring2.rotation.y = time * 0.25;
        ring2.rotation.x = time * 0.15;
        camera.position.x = Math.sin(time * 0.08) * 1.2;
        camera.position.y = Math.cos(time * 0.1) * 0.7;
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}

// Smooth scroll helper
function scrollToSection(id) {
    const element = document.getElementById(id);
    if (element) {
        element.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
}

    return React.createElement('div', { className: 'site-content' },

        // Navbar (hidden on mobile via CSS)

                React.createElement('div', { className: 'nav-links' },
                    React.createElement('a', { href: '#services' }, 'Services'),

                    React.createElement('a', { href: '#contact-form', className: 'btn btn-secondary', style: { padding: '8px 20px' } }, 'Get Started')
                )
            )
        ),
        // Hero Section with clickable video lightbox
        React.createElement('section', { style: { paddingTop: '20px' } },
            React.createElement('div', { className: 'container' },
                React.createElement(MotionComponent.div, { variants: fadeUp, initial: 'hidden', animate: 'visible', className: 'hero-grid' },
                    React.createElement('div', null,
                        React.createElement('div', { className: 'hero-badge' }, 'Consistency as a service'),
                        React.createElement('h1', { className: 'hero-headline' },
