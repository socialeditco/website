// --- Ensure window.motion from Framer Motion UMD ---
const { motion } = window;  // Framer Motion exposes window.motion

// --- Three.js isolated module (background particle system) ---
function initThreeBackground() {
    const canvas = document.getElementById('bg-canvas');
    if (!canvas) return;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30;
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    
    // subtle gradient particles
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 800;
    const posArray = new Float32Array(particlesCount * 3);
    for(let i = 0; i < particlesCount; i++) {
        posArray[i*3] = (Math.random() - 0.5) * 80;
        posArray[i*3+1] = (Math.random() - 0.5) * 50;
        posArray[i*3+2] = (Math.random() - 0.5) * 40 - 20;
    }
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMaterial = new THREE.PointsMaterial({
        color: 0x65C466,
        size: 0.18,
        transparent: true,
        opacity: 0.4,
        blending: THREE.AdditiveBlending
    });
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);
    
    // floating rings
    const ringGeo = new THREE.TorusGeometry(5, 0.12, 64, 300);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0x00ACD2, emissive: 0x007799, transparent: true, opacity: 0.35 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    scene.add(ring);
    
    const ring2Geo = new THREE.TorusGeometry(7.5, 0.08, 64, 300);
    const ring2Mat = new THREE.MeshStandardMaterial({ color: 0x65C466, emissive: 0x338833, transparent: true, opacity: 0.3 });
    const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
    scene.add(ring2);
    
    // ambient light
    const ambientLight = new THREE.AmbientLight(0x404060);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(1, 2, 1);
    scene.add(dirLight);
    
    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.005;
        particlesMesh.rotation.y = time * 0.1;
        particlesMesh.rotation.x = Math.sin(time * 0.2) * 0.1;
        ring.rotation.x = time * 0.3;
        ring.rotation.z = time * 0.2;
        ring2.rotation.y = time * 0.2;
        ring2.rotation.x = time * 0.15;
        camera.position.x = Math.sin(time * 0.1) * 1.2;
        camera.position.y = Math.cos(time * 0.13) * 0.8;
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
    }
    animate();
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}
